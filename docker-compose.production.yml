name: testplatform

# Production stack. Keep its .env file on the server and do not commit it.
# API_IMAGE and ADMIN_IMAGE must point to immutable images published by CI.

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_DB_USER:?Set APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      POSTGRES_DB: testPlatformDb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:?Set APP_DB_USER} -d testPlatformDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    image: ${API_IMAGE:?Set API_IMAGE}:${APP_VERSION:?Set APP_VERSION}
    restart: "no"
    command: ["dotnet", "TestPlatform.Web.dll", "--migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__TestPlatformContextPostgreSQL: "Host=postgres;Port=5432;Database=testPlatformDb;Username=${APP_DB_USER:?Set APP_DB_USER};Password=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}"
      Authentication__MetadataAddress: "${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}/realms/${KEYCLOAK_REALM:-test-platform}/.well-known/openid-configuration"
      Authentication__ValidIssuer: "${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM:-test-platform}"
      Authentication__Audience: ${KEYCLOAK_API_AUDIENCE:-test-platform-api}
      IdentityManagement__BaseUrl: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      IdentityManagement__Realm: ${KEYCLOAK_REALM:-test-platform}
      IdentityManagement__ClientId: ${KEYCLOAK_ADMIN_CLIENT_ID:-test-platform-admin}
      IdentityManagement__ClientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET}
      ImageStorage__Minio__Endpoint: minio:9000
      ImageStorage__Minio__PublicEndpoint: ${MINIO_PUBLIC_URL:?Set MINIO_PUBLIC_URL}
      ImageStorage__Minio__AccessKey: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      ImageStorage__Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      ImageStorage__Minio__BucketName: ${MINIO_BUCKET_NAME:-testplatform-images}
      # The API connects to MinIO over the private Docker network; TLS ends at nginx.
      ImageStorage__Minio__UseSsl: "false"
      Seq__ServerUrl: http://seq:5341
      Cors__AllowedOrigins__0: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL}

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9100:9000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    image: ${SEQ_IMAGE:-datalust/seq:latest}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?Set SEQ_ADMIN_PASSWORD}
    volumes:
      - seq_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    restart: unless-stopped
    command: start --import-realm
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./TestPlatform.Backend/containers/keycloak/import:/opt/keycloak/data/import:ro
      - ./TestPlatform.Backend/containers/keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "127.0.0.1:8080:8080"

  api:
    image: ${API_IMAGE:?Set API_IMAGE}:${APP_VERSION:?Set APP_VERSION}
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment: *api-environment
    ports:
      - "127.0.0.1:5062:5062"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5062/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  admin:
    image: ${ADMIN_IMAGE:?Set ADMIN_IMAGE}:${APP_VERSION:?Set APP_VERSION}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5176:80"

volumes:
  pgdata:
  keycloak_pgdata:
  minio_data:
  seq_data:
