services:
  postgres:
    image: postgres:15
    container_name: testplatform_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: testPlatformDb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    container_name: testplatform_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5062:5062"
    depends_on:
      - postgres
      - minio
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5062"
      ConnectionStrings__TestPlatformContextPostgreSQL: "Host=postgres;Port=5432;Database=testPlatformDb;Username=postgres;Password=123456789"
      ImageStorage__Minio__Endpoint: "minio:9000"
      ImageStorage__Minio__PublicEndpoint: "http://localhost:9100"
      ImageStorage__Minio__AccessKey: "minioadmin"
      ImageStorage__Minio__SecretKey: "minioadmin"
      ImageStorage__Minio__BucketName: "testplatform-images"
      ImageStorage__Minio__UseSsl: "false"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: testplatform_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    container_name: testplatform_keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./containers/identity:/opt/keycloak/data
      - ./containers/identity/themes:/opt/keycloak/themes
    user: root
  
volumes:
  pgdata:
  minio_data:
